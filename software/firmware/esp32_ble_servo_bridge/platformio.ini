[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Pinned to the 1.x line: the BLE code below uses the 1.4.x NimBLE-Arduino API
; (getValue() -> std::string, createCharacteristic() -> raw pointer). 2.x renamed
; some of these; bump the pin deliberately, not by accident.
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
