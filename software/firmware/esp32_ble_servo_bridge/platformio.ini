[env:esp32dev]
; Pinned: an unpinned `platform = espressif32` resolves the newest release,
; which bundles Arduino core 3.x / ESP-IDF 5.x. NimBLE-Arduino 1.4.x (pinned
; below, deliberately) is built against core 2.x / IDF4's BT controller
; lifecycle — on IDF5 it crash-loops on first boot
; (`esp_bt_controller_init` -> ESP_ERR_INVALID_STATE, confirmed on real
; hardware). 6.9.0 is the last espressif32 release on Arduino core 2.0.17.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Pinned to the 1.x line: the BLE code below uses the 1.4.x NimBLE-Arduino API
; (getValue() -> std::string, createCharacteristic() -> raw pointer). 2.x renamed
; some of these; bump the pin deliberately, not by accident.
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit NeoPixel @ ^1.12.3
build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
