; PlatformIO project for the BIGTREETECH Octopus (standard, non-Pro) control
; board firmware. See README.md for the chip-variant note (F446ZE default;
; confirm against the physical board before first flash) and the
; USB-CDC/no-SWD-header risks flagged during planning — none of this has
; been bench-verified yet.

[env:octopus]
platform = ststm32@~12.1 ; pinned: a community build of Arduino-framework
                         ; firmware for this board family hit link errors
                         ; after a platform version bump — verify before
                         ; moving off this pin.
board = octopus_f446     ; custom board.json in boards/, cloned from
                         ; PlatformIO's own nucleo_f446ze.json — change to
                         ; an F429ZGT6/F407ZET6 variant here if the physical
                         ; chip turns out to differ, see README.
framework = arduino

; BTT's own SD-card bootloader lives at the start of flash; application
; code is linked to start after it. NOT YET VERIFIED on real hardware —
; confirm this offset against the actual bootloader before relying on it.
board_build.offset = 0x8000
board_upload.offset_address = 0x08008000

build_flags =
    -D FIRMWARE_VARIANT=\"octopus\"

; No SWD header is broken out on the Pro board (confirmed during planning
; via a stm32duino core maintainer's own forum report) — assumed true here
; too since it's the same PCB family, but not independently confirmed for
; the standard board. DFU over USB-C is the only direct upload path
; PlatformIO can drive. This overwrites BTT's own SD-card bootloader; see
; README for the SD-card-flashing alternative and its tradeoff before using
; `pio run -t upload`.
upload_protocol = dfu
