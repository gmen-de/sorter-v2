; PlatformIO project for the BIGTREETECH Octopus (standard, non-Pro) control
; board firmware. See README.md for the chip-variant note (F446ZE default;
; confirm against the physical board before first flash) and the
; USB-CDC/no-SWD-header risks flagged during planning. This project has
; been confirmed to COMPILE AND LINK cleanly (2026-11-06) with the settings
; below — see README's "Known limitations" for what's still only verified
; at the compile level, not on real hardware.
;
; NOTE: this project uses its own trimmed variant folder
; (boards/variants/octopus_f446/, referenced from boards/octopus_f446.json's
; build.variant/variants_dir) instead of the upstream framework's shared
; STM32F4xx/F446Z(C-E)(H-J-T) variant folder, which also contains a
; NUCLEO-board-specific variant file alongside the generic one. The actual
; fix for a confusing set of "undefined reference to digitalPin"-style
; linker errors wasn't the file collision, though — it was that the
; upstream generic variant's digitalPin[]/analogInputPin[] tables and
; SystemClock_Config() are all gated behind `#if defined(ARDUINO_GENERIC_F446Z...)`
; macros matching specific upstream "Generic Fxxx" board IDs, which our
; custom board never defines on its own. Fixed via the explicit
; `-DARDUINO_GENERIC_F446ZETX` in board.json's extra_flags below (Z package,
; E=512KB flash, T temperature/package suffix, matching stm32f446zet6).

[env:octopus]
platform = ststm32@20.0.0 ; confirmed compiling at this version (2026-11-06);
                          ; older ~12.x pins shipped a 2020-era framework
                          ; (1.9.0) that doesn't have a proper 144-pin F446Z
                          ; package variant at all (see git history/PR notes
                          ; if this version needs bumping again).
board = octopus_f446      ; custom board.json in boards/, cloned from
                          ; PlatformIO's own nucleo_f446ze.json — change to
                          ; an F429ZGT6/F407ZET6 variant here if the physical
                          ; chip turns out to differ, see README. (If you do,
                          ; also update boards/variants/octopus_f446/'s
                          ; PeripheralPins.c/PinNamesVar.h from that chip's
                          ; own shared variant folder, and the
                          ; ARDUINO_GENERIC_* macro in extra_flags to match.)
framework = arduino

build_flags =
    -D FIRMWARE_VARIANT=\"octopus\"

; No SWD header is broken out on the Pro board (confirmed during planning
; via a stm32duino core maintainer's own forum report) — assumed true here
; too since it's the same PCB family, but not independently confirmed for
; the standard board. DFU over USB-C is the only direct upload path
; PlatformIO can drive. This overwrites BTT's own SD-card bootloader; see
; README for the SD-card-flashing alternative and its tradeoff before using
; `pio run -t upload`.
upload_protocol = dfu
