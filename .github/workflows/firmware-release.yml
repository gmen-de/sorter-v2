name: Firmware Release

on:
  push:
    tags:
      - 'firmware/v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

      - name: Clone Pico SDK
        working-directory: software/firmware/sorter_interface_firmware
        run: make setup

      - name: Build feeder-v1-1
        working-directory: software/firmware/sorter_interface_firmware
        run: make build-feeder-v1-1

      - name: Build distribution-v1-1
        working-directory: software/firmware/sorter_interface_firmware
        run: make build-distribution-v1-1

      - name: Build distribution-v1-2
        working-directory: software/firmware/sorter_interface_firmware
        run: make build-distribution-v1-2

      - name: Build feeder-skr
        working-directory: software/firmware/sorter_interface_firmware
        run: make build-feeder-skr

      - name: Build distribution-skr
        working-directory: software/firmware/sorter_interface_firmware
        run: make build-distribution-skr

      - name: Rename artifacts
        working-directory: software/firmware/sorter_interface_firmware
        run: |
          VER=${GITHUB_REF_NAME#firmware/}
          cp build-feeder-v1-1/sorter_interface_firmware.uf2        basically-v1-1-feeder-${VER}.uf2
          cp build-distribution-v1-1/sorter_interface_firmware.uf2   basically-v1-1-distribution-${VER}.uf2
          cp build-distribution-v1-2/sorter_interface_firmware.uf2   basically-v1-2-distribution-${VER}.uf2
          cp build-feeder-skr/sorter_interface_firmware.uf2          feeder-skr-${VER}.uf2
          cp build-distribution-skr/sorter_interface_firmware.uf2    distribution-skr-${VER}.uf2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build octopus (BTT Octopus, DFU-flashed — see its README)
        working-directory: software/firmware/octopus_control_board
        run: pio run -e octopus

      - name: Rename octopus artifact
        run: |
          VER=${GITHUB_REF_NAME#firmware/}
          cp software/firmware/octopus_control_board/.pio/build/octopus/firmware.bin \
             software/firmware/octopus_control_board/octopus-distribution-${VER}.bin

      - name: Build esp32-ble-servo-bridge
        working-directory: software/firmware/esp32_ble_servo_bridge
        run: pio run -e esp32dev

      - name: Merge esp32 image into one flashable file
        run: |
          VER=${GITHUB_REF_NAME#firmware/}
          BUILD=software/firmware/esp32_ble_servo_bridge/.pio/build/esp32dev
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          python -m esptool --chip esp32 merge_bin \
            -o software/firmware/esp32_ble_servo_bridge/esp32-ble-servo-bridge-${VER}.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin"

      - name: Build firmware-only release notes
        run: |
          CURRENT="$GITHUB_REF_NAME"
          PREV=$(git tag -l 'firmware/v*' | sort -V | awk -v cur="$CURRENT" '$0==cur{print prev} {prev=$0}')
          FW_DIRS="software/firmware/sorter_interface_firmware software/firmware/octopus_control_board software/firmware/esp32_ble_servo_bridge"
          if [ -n "$PREV" ]; then
            echo "## Firmware changes since ${PREV#firmware/}" > RELEASE_NOTES.md
            RANGE="${PREV}..HEAD"
          else
            echo "## Firmware changes" > RELEASE_NOTES.md
            RANGE="HEAD"
          fi
          echo "" >> RELEASE_NOTES.md
          CHANGES=$(git log --full-history --no-merges --pretty=format:'- %s (%h)' "$RANGE" -- $FW_DIRS)
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES" >> RELEASE_NOTES.md
          else
            echo "_No firmware changes since the previous release._" >> RELEASE_NOTES.md
          fi
          cat >> RELEASE_NOTES.md <<'EOF'

          ## Firmware files

          Flash the `.uf2` for your board revision and role. Hold BOOTSEL while plugging in the Pico, then drag the file onto the RPI-RP2 drive.

          **basically v1-1** — labeled either "Feeder" or "Distribution" on the board. Download both:
          - `feeder-v1-1` → the board controlling the feeder stages
          - `distribution-v1-1` → the board controlling the chute and bin tower

          **basically v1-2** — has 5 total steppers. Only one firmware needed:
          - `distribution-v1-2` → handles everything on the v1-2 board

          **SKR Pico** — labeled either "Feeder" or "Distribution" on the board. Download both:
          - `feeder-skr` → the board controlling the feeder stages
          - `distribution-skr` → the board controlling the chute and bin tower

          **BTT Octopus** — flashed via DFU, not drag-and-drop (BOOT0 jumper + reset; see the firmware's own README):
          - `octopus-distribution` → the distribution board, running the "octopus by g-men" firmware variant

          **ESP32 BLE servo bridge** — flashed over USB-serial with esptool (from the sorter's Settings UI, or by hand):
          - `esp32-ble-servo-bridge` → the Waveshare "Servo Driver with ESP32" board running the BLE gate bridge firmware

          | File | Board | Role |
          |------|-------|------|
          | `basically-v1-1-feeder-*.uf2` | basically v1-1 | Feeder MB |
          | `basically-v1-1-distribution-*.uf2` | basically v1-1 | Distribution MB |
          | `basically-v1-2-distribution-*.uf2` | basically v1-2 | Distribution MB (all-in-one) |
          | `feeder-skr-*.uf2` | SKR Pico | Feeder MB |
          | `distribution-skr-*.uf2` | SKR Pico | Distribution MB |
          | `octopus-distribution-*.bin` | BTT Octopus | Distribution MB (DFU flash) |
          | `esp32-ble-servo-bridge-*.bin` | Waveshare ESP32 servo driver | BLE gate bridge (esptool flash) |
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Firmware ${{ github.ref_name }}"
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: |
            software/firmware/sorter_interface_firmware/basically-v1-1-feeder-*.uf2
            software/firmware/sorter_interface_firmware/basically-v1-1-distribution-*.uf2
            software/firmware/sorter_interface_firmware/basically-v1-2-distribution-*.uf2
            software/firmware/sorter_interface_firmware/feeder-skr-*.uf2
            software/firmware/sorter_interface_firmware/distribution-skr-*.uf2
            software/firmware/octopus_control_board/octopus-distribution-*.bin
            software/firmware/esp32_ble_servo_bridge/esp32-ble-servo-bridge-*.bin
